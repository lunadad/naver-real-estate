<!DOCTYPE html>
<html lang="ko" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>관심 매물 · 부동산 급매 알리미</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <link rel="stylesheet" href="{{ asset_url('css/style.css') }}" />
  <script>
    try { document.documentElement.setAttribute('data-theme', localStorage.getItem('theme') || 'light'); } catch (e) {}
  </script>
  <script src="{{ asset_url('js/watch-store.js') }}" defer></script>
  <script src="{{ asset_url('js/watchlist.js') }}" defer></script>
  <meta name="theme-color" content="#f6f7fb" />
</head>
<body>
<div class="tr-shell">
  <header class="tr-header">
    <a class="tr-back" href="/">← 급매 목록</a>
    <h1 class="tr-title">관심 매물</h1>
    <div class="tr-periods" role="group" aria-label="보기 선택" id="wl-tabs">
      <button type="button" class="tr-period" data-view="changes" aria-pressed="true">변동 <span id="wl-change-count"></span></button>
      <button type="button" class="tr-period" data-view="all" aria-pressed="false">전체 <span id="wl-all-count"></span></button>
    </div>
  </header>

  <main class="tr-main">
    <section class="tr-col-main" aria-labelledby="wl-list-title">
      <h2 id="wl-list-title" class="tr-h2">찜한 매물 <span id="wl-summary" class="tr-muted"></span></h2>
      <div id="wl-list" class="tr-list" aria-live="polite">
        <div class="tr-muted">불러오는 중…</div>
      </div>
    </section>

    <aside class="tr-col-side">
      <section class="tr-panel" aria-labelledby="wl-new-title">
        <h2 id="wl-new-title" class="tr-h2">찜한 단지에 새로 나온 급매</h2>
        <div id="wl-new" class="tr-list"><div class="tr-muted">불러오는 중…</div></div>
      </section>
      <section class="tr-caveat" role="note">
        <strong>안내</strong>
        <p>찜 목록은 이 브라우저에만 저장됩니다. 다른 기기나 시크릿 창에서는 보이지 않아요.
        가격 변동은 찜할 때 가격과 최신 크롤링 가격을 비교합니다.</p>
      </section>
    </aside>
  </main>
</div>
</body>
</html>
