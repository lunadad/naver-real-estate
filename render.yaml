services:
  - type: web
    name: naver-real-estate
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    autoDeployTrigger: off
    healthCheckPath: /api/crawl-status
    envVars:
      # Set this manually in Render to your Neon Free Postgres connection string.
      - key: DATABASE_URL
        sync: false
      - key: DB_SCHEMA
        value: "commercial_v2"
      - key: ENABLE_SCHEDULER
        value: "false"
      - key: ENABLE_CRAWL_ENDPOINT
        value: "false"
      - key: SEED_DEMO_DATA
        value: "false"
      - key: ALLOW_DEMO_FALLBACK
        value: "false"
      - key: SKIP_STARTUP_BACKFILL
        value: "true"
      - key: LOCAL_CRAWL_SCHEDULE_HOUR
        value: "10"
      - key: LOCAL_CRAWL_SCHEDULE_MINUTE
        value: "0"
      - key: DB_POOL_MIN_SIZE
        value: "0"
      - key: DB_POOL_MAX_SIZE
        value: "3"
      - key: SECRET_KEY
        generateValue: true
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        sync: false
